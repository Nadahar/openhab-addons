name: openHAB Static Analysis (Java 21)

on:
  pull_request:
    branches: [ main, PR-warnings ]
  workflow_dispatch:

jobs:
  analyze:
    name: Check New Warnings
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Viktig for at Reviewdog skal kunne sammenligne diff

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Run SAT Plugin
        # Vi kjører compile først for å sikre at SpotBugs har bytecode å analysere
        run: mvn clean compile -DskipTests -B -pl :org.openhab.binding.enocean

      - name: Setup reviewdog CLI
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Report Checkstyle results via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Looking for Checkstyle reports..."
          find . -type f -path '*/target/checkstyle-result.xml' -print0 | \
            while IFS= read -r -d '' f; do
              echo "Processing $f"
              reviewdog -f=checkstyle -name="checkstyle" -reporter=github-pr-check -level=warning -filter-mode=added < "$f"
            done

      - name: Report PMD results via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Looking for PMD reports..."
          find . -type f -path '*/target/pmd.xml' -print0 | \
            while IFS= read -r -d '' f; do
              echo "Processing $f"
              reviewdog -f=pmd -name="pmd" -reporter=github-pr-check -level=warning -filter-mode=added < "$f"
            done

      - name: Report SpotBugs results via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Looking for SpotBugs reports..."
          find . -type f -path '*/target/spotbugsXml.xml' -print0 | \
            while IFS= read -r -d '' f; do
              echo "Processing $f"
              reviewdog -f=spotbugs -name="spotbugs" -reporter=github-pr-check -level=warning -filter-mode=added < "$f"
            done
